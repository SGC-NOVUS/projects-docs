name: auto-translate

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches: [main]
    paths:
      - "content/**/*.en.md"
      - "config/*.json"
      - "scripts/*.py"
      - ".github/workflows/auto-translate.yml"

permissions:
  contents: write

jobs:
  localize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Sync English docs from private repositories
        env:
          DOCS_SYNC_GITHUB_TOKEN: ${{ secrets.DOCS_SYNC_GITHUB_TOKEN }}
        run: |
          if [[ -z "${DOCS_SYNC_GITHUB_TOKEN:-}" ]]; then
            echo "DOCS_SYNC_GITHUB_TOKEN not set, skip source sync"
            exit 0
          fi
          python scripts/sync_private_docs.py

      - name: Generate localizations
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: python scripts/translate.py

      - name: Commit localized files
        run: |
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content
          [[ -f .tmp/localized-files.txt ]] && git add .tmp/localized-files.txt || true
          [[ -f .tmp/synced-english-files.txt ]] && git add .tmp/synced-english-files.txt || true
          [[ -f .tmp/source-sync-report.json ]] && git add .tmp/source-sync-report.json || true
          git commit -m "chore(docs): sync source docs and auto-generate localizations"
          git push
