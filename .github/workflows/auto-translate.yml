name: auto-translate

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches: [main]
    paths:
      - "content/**/*.en.md"
      - "config/*.json"
      - "scripts/*.py"
      - ".github/workflows/auto-translate.yml"

permissions:
  contents: write

jobs:
  localize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Sync English docs from private repositories
        if: ${{ secrets.DOCS_SYNC_GITHUB_TOKEN != '' }}
        env:
          DOCS_SYNC_GITHUB_TOKEN: ${{ secrets.DOCS_SYNC_GITHUB_TOKEN }}
        run: python scripts/sync_private_docs.py

      - name: Generate localizations
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: python scripts/translate.py

      - name: Commit localized files
        run: |
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content .tmp/localized-files.txt .tmp/docs-sync-payload.json .tmp/synced-english-files.txt .tmp/source-sync-report.json
          git commit -m "chore(docs): sync source docs and auto-generate localizations"
          git push

      - name: Notify portal webhook
        if: ${{ secrets.DOCS_SYNC_WEBHOOK_URL != '' }}
        env:
          WEBHOOK_URL: ${{ secrets.DOCS_SYNC_WEBHOOK_URL }}
          WEBHOOK_SECRET: ${{ secrets.DOCS_SYNC_WEBHOOK_SECRET }}
        run: |
          if [[ ! -f .tmp/docs-sync-payload.json ]]; then
            echo "payload missing, skip webhook"
            exit 0
          fi
          payload=$(cat .tmp/docs-sync-payload.json)
          signature=""
          if [[ -n "$WEBHOOK_SECRET" ]]; then
            digest=$(printf '%s' "$payload" | openssl dgst -sha256 -hmac "$WEBHOOK_SECRET" | sed 's/^.* //')
            signature="sha256=$digest"
          fi
          curl -sS -X POST "$WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -H "X-Hub-Signature-256: $signature" \
            --data "$payload"
